name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"   # weekly, so a broken runner or dependency shows up even without commits

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: git identity for tests that build throwaway repos
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: quickstart 1
        run: python gates/lint.py examples/drafts/good/01-slack-pilot-update.txt --profile templates/voice-profile.example.md
      - name: bad draft must fail the linter
        run: |
          if python gates/lint.py examples/drafts/bad/01-slack-table-and-filler.txt; then echo 'bad draft passed the linter'; exit 1; fi
